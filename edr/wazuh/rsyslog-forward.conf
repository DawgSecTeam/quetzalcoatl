# Ship system logs to the Wazuh manager's syslog input (514/udp).
# Used on hosts that cannot run a Wazuh agent (Alpine) or when the agent
# package is unavailable. Installed by edr/deploy-edr.sh.

module(load="imuxsock")
module(load="imklog")

*.* action(type="omfwd" target="__MANAGER__" port="514" protocol="udp"
     action.resumeRetryCount="-1" queue.type="linkedList" queue.size="10000")
