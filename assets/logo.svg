<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      .bg { fill: #0a0e17; }
      .serpent { fill: none; stroke: #00ff41; stroke-width: 2.5; stroke-linecap: square; }
      .serpent-thick { fill: none; stroke: #00ff41; stroke-width: 4; stroke-linecap: square; }
      .feather { fill: none; stroke: #00cc33; stroke-width: 1.5; stroke-linecap: square; }
      .accent { fill: none; stroke: #008f11; stroke-width: 1; stroke-linecap: square; }
      .gem { fill: #00ff41; }
      .gem-dim { fill: #008f11; }
      .text-main { fill: #00ff41; font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold; letter-spacing: 8px; }
      .text-sub { fill: #008f11; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 4px; }
      .border { fill: none; stroke: #008f11; stroke-width: 1; }
      .border-bright { fill: none; stroke: #00ff41; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="600" height="400"/>

  <!-- Outer frame - stepped Aztec style -->
  <rect class="border-bright" x="15" y="15" width="570" height="370"/>
  <rect class="border" x="25" y="25" width="550" height="350"/>

  <!-- Corner step decorations -->
  <polyline class="border-bright" points="15,40 40,40 40,15"/>
  <polyline class="border-bright" points="585,40 560,40 560,15"/>
  <polyline class="border-bright" points="15,360 40,360 40,385"/>
  <polyline class="border-bright" points="585,360 560,360 560,385"/>

  <!-- Stepped pyramid base (bottom) -->
  <polygon class="border" points="80,340 120,320 480,320 520,340"/>
  <polygon class="border" points="120,320 160,300 440,300 480,320"/>
  <polygon class="border" points="160,300 200,280 400,280 440,300"/>

  <!-- Center: Stylized geometric Q / serpent head -->
  <!-- Main serpent body - coiled geometric shape -->
  <polygon class="serpent-thick" points="
    280,100 320,100 340,120 340,160 320,180 300,180
    300,160 310,160 310,130 290,130 290,170
    280,180 260,180 250,170 250,150
    260,140 270,140 270,110 260,100
  "/>

  <!-- Serpent eye -->
  <polygon class="gem" points="315,125 325,120 330,125 325,130"/>
  <polygon class="gem-dim" points="318,126 323,123 326,126 323,129"/>

  <!-- Serpent mouth / fangs -->
  <line class="serpent" x1="280" y1="145" x2="260" y2="155"/>
  <line class="serpent" x1="280" y1="155" x2="265" y2="165"/>
  <polygon class="gem" points="258,153 252,158 256,156"/>
  <polygon class="gem" points="263,163 257,170 261,166"/>

  <!-- Feather patterns along serpent body (left side) -->
  <line class="feather" x1="250" y1="105" x2="230" y2="90"/>
  <line class="feather" x1="240" y1="110" x2="218" y2="98"/>
  <line class="feather" x1="250" y1="130" x2="225" y2="122"/>
  <line class="feather" x1="250" y1="155" x2="228" y2="150"/>
  <line class="feather" x1="250" y1="175" x2="230" y2="172"/>
  <!-- Feather barbs -->
  <line class="accent" x1="230" y1="90" x2="222" y2="85"/>
  <line class="accent" x1="230" y1="90" x2="225" y2="82"/>
  <line class="accent" x1="218" y1="98" x2="210" y2="93"/>
  <line class="accent" x1="218" y1="98" x2="213" y2="90"/>
  <line class="accent" x1="225" y1="122" x2="217" y2="117"/>
  <line class="accent" x1="225" y1="122" x2="220" y2="114"/>
  <line class="accent" x1="228" y1="150" x2="220" y2="145"/>
  <line class="accent" x1="228" y1="150" x2="223" y2="142"/>
  <line class="accent" x1="230" y1="172" x2="222" y2="167"/>
  <line class="accent" x1="230" y1="172" x2="225" y2="164"/>

  <!-- Feather patterns along serpent body (top) -->
  <line class="feather" x1="285" y1="100" x2="280" y2="80"/>
  <line class="feather" x1="300" y1="100" x2="298" y2="78"/>
  <line class="feather" x1="315" y1="100" x2="315" y2="78"/>
  <line class="feather" x1="330" y1="110" x2="335" y2="88"/>
  <line class="feather" x1="340" y1="125" x2="348" y2="105"/>
  <!-- Feather barbs top -->
  <line class="accent" x1="280" y1="80" x2="273" y2="75"/>
  <line class="accent" x1="280" y1="80" x2="276" y2="72"/>
  <line class="accent" x1="298" y1="78" x2="291" y2="73"/>
  <line class="accent" x1="298" y1="78" x2="294" y2="70"/>
  <line class="accent" x1="315" y1="78" x2="308" y2="73"/>
  <line class="accent" x1="315" y1="78" x2="311" y2="70"/>
  <line class="accent" x1="335" y1="88" x2="328" y2="83"/>
  <line class="accent" x1="335" y1="88" x2="330" y2="80"/>
  <line class="accent" x1="348" y1="105" x2="341" y2="100"/>
  <line class="accent" x1="348" y1="105" x2="343" y2="97"/>

  <!-- Stepped diamond / Aztec cross above serpent -->
  <polygon class="accent" points="300,40 310,50 300,60 290,50"/>
  <polygon class="accent" points="280,45 290,55 280,65 270,55"/>
  <polygon class="accent" points="320,45 330,55 320,65 310,55"/>
  <polygon class="gem" points="300,48 304,50 300,52 296,50"/>

  <!-- Right side geometric serpent tail -->
  <polyline class="serpent-thick" points="340,160 360,155 370,165 360,175 380,170 390,180 380,190 395,195 385,205"/>
  <polyline class="serpent" points="395,195 410,190 420,200 410,210 425,215 415,225"/>
  <!-- Tail feathers -->
  <line class="feather" x1="360" y1="155" x2="375" y2="140"/>
  <line class="feather" x1="380" y1="170" x2="395" y2="158"/>
  <line class="feather" x1="395" y1="195" x2="410" y2="185"/>
  <line class="accent" x1="375" y1="140" x2="370" y2="135"/>
  <line class="accent" x1="375" y1="140" x2="382" y2="135"/>
  <line class="accent" x1="395" y1="158" x2="390" y2="153"/>
  <line class="accent" x1="395" y1="158" x2="402" y2="153"/>
  <line class="accent" x1="410" y1="185" x2="405" y2="180"/>
  <line class="accent" x1="410" y1="185" x2="417" y2="180"/>

  <!-- Left side serpent tail -->
  <polyline class="serpent-thick" points="260,100 240,95 230,105 220,95 205,100 195,90 185,100"/>
  <polyline class="serpent" points="185,100 170,105 160,95 150,105"/>
  <!-- Tail feathers left -->
  <line class="feather" x1="240" y1="95" x2="225" y2="80"/>
  <line class="feather" x1="220" y1="95" x2="205" y2="82"/>
  <line class="feather" x1="205" y1="100" x2="190" y2="88"/>
  <line class="accent" x1="225" y1="80" x2="218" y2="75"/>
  <line class="accent" x1="225" y1="80" x2="220" y2="72"/>
  <line class="accent" x1="205" y1="82" x2="198" y2="77"/>
  <line class="accent" x1="205" y1="82" x2="200" y2="74"/>
  <line class="accent" x1="190" y1="88" x2="183" y2="83"/>
  <line class="accent" x1="190" y1="88" x2="185" y2="80"/>

  <!-- Terminal-style bracket decorations -->
  <text x="25" y="55" fill="#008f11" font-family="'Courier New', monospace" font-size="16">[</text>
  <text x="565" y="55" fill="#008f11" font-family="'Courier New', monospace" font-size="16">]</text>

  <!-- Main title text -->
  <text class="text-main" x="300" y="270" text-anchor="middle">QUETZALCOATL</text>

  <!-- Subtitle -->
  <text class="text-sub" x="300" y="295" text-anchor="middle">SECURITY HARDENING TOOLKIT</text>

  <!-- Decorative line under text -->
  <line class="border-bright" x1="180" y1="280" x2="260" y2="280"/>
  <line class="border-bright" x1="340" y1="280" x2="420" y2="280"/>
  <polygon class="gem" points="300,276 306,280 300,284 294,280"/>

  <!-- Bottom decorative step pattern -->
  <line class="accent" x1="100" y1="310" x2="500" y2="310"/>
  <line class="accent" x1="140" y1="315" x2="460" y2="315"/>
  <line class="accent" x1="180" y1="320" x2="420" y2="320"/>

  <!-- Small decorative diamonds along bottom -->
  <polygon class="gem-dim" points="100,307 103,310 100,313 97,310"/>
  <polygon class="gem-dim" points="500,307 503,310 500,313 497,310"/>
  <polygon class="gem-dim" points="140,312 143,315 140,318 137,315"/>
  <polygon class="gem-dim" points="460,312 463,315 460,318 457,315"/>

  <!-- Version/hash indicator (terminal style) -->
  <text x="490" y="375" fill="#008f11" font-family="'Courier New', monospace" font-size="9">v1.0.0</text>
  <text x="25" y="375" fill="#008f11" font-family="'Courier New', monospace" font-size="9">dawgsec</text>

  <!-- Scanline effect overlay (subtle) -->
  <line x1="15" y1="80" x2="585" y2="80" stroke="#00ff41" stroke-width="0.3" opacity="0.1"/>
  <line x1="15" y1="120" x2="585" y2="120" stroke="#00ff41" stroke-width="0.3" opacity="0.1"/>
  <line x1="15" y1="160" x2="585" y2="160" stroke="#00ff41" stroke-width="0.3" opacity="0.1"/>
  <line x1="15" y1="200" x2="585" y2="200" stroke="#00ff41" stroke-width="0.3" opacity="0.1"/>
  <line x1="15" y1="240" x2="585" y2="240" stroke="#00ff41" stroke-width="0.3" opacity="0.1"/>
</svg>
